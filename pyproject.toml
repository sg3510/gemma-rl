[project]
name = "rlhf-toy"
version = "0.1.0"
description = "tau-bench retail baseline + RL training-frontier scan for Gemma 4 26B A4B"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.61.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "numpy>=1.26",
    "termcolor>=2.4",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["taurl*"]
